name: update profile

on:
  schedule:
    # Once a day. The traffic API keeps 14 days, so a missed day loses nothing.
    - cron: '17 5 * * *'
  workflow_dispatch:

# The job commits the regenerated README and the accumulated traffic data.
permissions:
  contents: write

concurrency:
  group: update-profile
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      # Repository traffic is readable only with a token of the owner (secret TRAFFIC_TOKEN, see docs/SETUP.md).
      # Without it the built-in token still updates the account numbers.
      - name: Rebuild the generated blocks
        env:
          GH_TOKEN: ${{ secrets.TRAFFIC_TOKEN || github.token }}
        run: node scripts/update-profile.mjs

      - name: Commit if something changed
        run: |
          if git diff --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: update profile numbers and traffic"
          git push
